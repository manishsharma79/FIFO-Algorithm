
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFO Page Replacement Simulator</title>

<style>
:root {
  --navy: #1c1b3b;
  --pale: #edf8f9;
  --cyan: #a8ffff;
  --yellow: #fff500;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  font-family: "Times New Roman", Times, serif;
  color: #17243a;
  background: linear-gradient(135deg, #f5f7ff, #e7f0f4);
}

.app {
  max-width: 1400px;
  margin: auto;
  border: 1px solid #aab5c7;
  border-radius: 12px;
  overflow: hidden;
  background: white;
  box-shadow: 0 10px 30px #20204020;
}

.bar {
  background: var(--navy);
  color: var(--cyan);
  padding: 10px 18px;
  font-size: 21px;
  font-family: Georgia, "Times New Roman", serif;
}

.top {
  display: grid;
  grid-template-columns: minmax(320px, 1.15fr) minmax(300px, 1fr);
  gap: 26px;
  padding: 28px 14px 18px;
  align-items: start;
}

.panel {
  background: var(--pale);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 10px 18px #20344b30;
  border: 1px solid #d4e3e7;
}

.panel-title {
  background: var(--navy);
  color: var(--cyan);
  text-align: center;
  padding: 5px;
  font-size: 21px;
  font-family: Georgia, "Times New Roman", serif;
}

.fields {
  padding: 18px 22px 20px;
}

.field {
  display: grid;
  grid-template-columns: minmax(180px, 220px) minmax(150px, 230px);
  gap: 12px;
  align-items: center;
  margin: 10px 0 24px;
}

.field:last-child {
  margin-bottom: 12px;
}

label {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 19px;
  font-weight: bold;
  line-height: 1.25;
}

input {
  width: 100%;
  min-width: 0;
  height: 42px;
  border: 1px solid #8bbcf5;
  border-radius: 5px;
  padding: 8px 12px;
  font: 15px Georgia, serif;
  background: white;
  color: #26354a;
}

input:focus {
  outline: 2px solid #a4d6ff;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 22px;
  align-items: flex-start;
  padding: 24px 4px;
}

button {
  min-width: 96px;
  border: 2px solid #8497ad;
  border-radius: 9px;
  padding: 9px 13px;
  font: bold 16px Georgia, serif;
  color: #bdfcff;
  cursor: pointer;
  background: linear-gradient(#35395d, #050b2b);
  box-shadow: 0 3px 7px #0006, inset 0 0 0 2px #64738a;
}

button:hover:not(:disabled) {
  transform: translateY(-1px);
  filter: brightness(1.15);
}

button:disabled {
  background: linear-gradient(#b6bdc9, #737d91);
  color: #f1f5f9;
  cursor: not-allowed;
  opacity: .8;
}

.details {
  padding: 26px 8px;
  font: bold 23px Arial, sans-serif;
  color: blue;
  line-height: 2.4;
}

.details span {
  color: #171717;
  font: 22px Georgia, serif;
  font-weight: normal;
  overflow-wrap: anywhere;
}

.memory {
  margin: 0 14px 12px;
  min-height: 360px;
}

.memory-body {
  min-height: 360px;
  background: var(--pale);
  padding: 28px 20px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

#visual {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: clamp(8px, 2.8vw, 40px);
  flex-wrap: wrap;
  padding: 20px 4px;
}

.step-column {
  text-align: center;
  min-width: 42px;
}

.ref {
  height: 25px;
  font-size: 16px;
}

.frame {
  width: 38px;
  height: 38px;
  border: 1px solid #222;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  font-size: 17px;
}

.frame.hit-highlight {
  background: #fff500;
  border: 2px solid #d1a900;
  font-weight: bold;
}

.frame.fault-highlight {
  background: #ffb36b;
  border: 2px solid #d96b00;
  font-weight: bold;
}

.status.hit-status {
  color: #087c36;
  font-weight: bold;
}

.status.fault-status {
  color: #c14c00;
  font-weight: bold;
}

.status {
  font-size: 16px;
  margin-top: 5px;
}

#explanation {
  font-size: 22px;
  padding: 10px 2px 0;
  min-height: 42px;
  overflow-wrap: anywhere;
}

.footer {
  background: var(--navy);
  color: var(--cyan);
  text-align: center;
  padding: 7px;
  font-size: 23px;
  font-family: Georgia, "Times New Roman", serif;
  line-height: 1.35;
}

.algorithm-name {
  font-size: .78em;
  margin-top: 2px;
}

.summary {
  display: none;
  padding: 15px 20px;
  margin: 0 14px 14px;
  border-radius: 10px;
  background: #eaf5ff;
  border: 1px solid #c8dff5;
  font: 18px Arial, sans-serif;
  line-height: 1.7;
}

.summary strong {
  color: #1a315a;
}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #0008;
  backdrop-filter: blur(4px);
  z-index: 10;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal {
  position: relative;
  width: min(520px, 100%);
  min-height: 300px;
  background: white;
  border-radius: 7px;
  box-shadow: 0 15px 40px #0005;
  text-align: center;
  padding: 34px 30px 38px;
}

.close {
  position: absolute;
  right: 15px;
  top: 6px;
  border: 0;
  box-shadow: none;
  background: none;
  color: black;
  font: 40px Arial, sans-serif;
  min-width: 0;
  padding: 0;
}

.symbol {
  width: 84px;
  height: 84px;
  margin: 10px auto 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font: bold 60px Arial, sans-serif;
  background: #80c900;
}

.symbol.error {
  background: #f0162b;
  font-size: 58px;
}

.symbol.info {
  background: #148de0;
}

.modal h2 {
  font-size: 27px;
  margin: 0 0 28px;
  color: #222;
}

.modal p {
  font-size: 24px;
  line-height: 1.5;
  margin: 0;
  color: #222;
}

@media (max-width: 760px) {
  body {
    padding: 5px;
  }

  .top {
    grid-template-columns: 1fr;
    gap: 8px;
    padding-top: 15px;
  }

  .field {
    grid-template-columns: 1fr;
    gap: 9px;
    margin-bottom: 24px;
  }

  label {
    font-size: 18px;
  }

  .controls {
    flex-direction: row;
    flex-wrap: wrap;
    padding: 0 5px 12px;
    gap: 10px;
  }

  .details {
    padding: 0 6px 10px;
    font-size: 18px;
    line-height: 1.8;
  }

  .details span {
    font-size: 18px;
  }

  .memory,
  .summary {
    margin-left: 7px;
    margin-right: 7px;
  }

  .memory-body {
    min-height: 300px;
  }

  .footer {
    font-size: 17px;
  }

  .modal p {
    font-size: 20px;
  }
}

@media print {
  @page {
    size: auto;
    margin: 8mm;
  }

  html,
  body {
    background: white !important;
    padding: 0 !important;
    margin: 0 !important;
    color: #17243a;
  }

  body {
    zoom: .92;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .app {
    max-width: none;
    width: 100%;
    border: 1px solid #1c1b3b;
    border-radius: 8px;
    box-shadow: none;
    overflow: visible;
    display: flex;
    flex-direction: column;
  }

  .bar {
    background: white !important;
    color: #6296aa !important;
    padding: 5px 12px;
    font-size: 14px;
  }

  .top {
    grid-template-columns: minmax(300px, 1.05fr) minmax(270px, 1fr);
    gap: 20px;
    padding: 10px;
    align-items: start;
  }

  #inputPanel {
    display: none !important;
  }

  #countPanel {
    display: block !important;
    padding: 12px 16px;
  }

  #countPanel .field {
    grid-template-columns: minmax(180px, 1fr) minmax(130px, 190px);
    gap: 8px;
    margin: 6px 0 10px;
  }

  #countPanel .field:last-child {
    margin-bottom: 4px;
  }

  #countPanel label {
    font-size: 17px;
  }

  #countPanel input {
    padding: 8px 10px;
    font-size: 14px;
  }

  .panel-title {
    background: white !important;
    color: #6296aa !important;
    font-size: 17px;
    padding: 4px;
  }

  .controls {
    display: flex !important;
    flex-direction: column;
    gap: 9px;
    padding: 8px 4px;
  }

  button {
    min-width: 76px;
    padding: 6px 8px;
    font-size: 12px;
    box-shadow: 0 1px 3px #0003;
  }

  .details {
    display: block !important;
    padding: 8px 4px;
    font-size: 17px;
    line-height: 1.9;
  }

  .details span {
    font-size: 16px;
  }

  .memory {
    margin: 0 8px 5px;
    min-height: 0;
  }

  .memory-body {
    min-height: 0;
    padding: 12px;
    gap: 10px;
  }

  #visual {
    gap: clamp(10px, 1.8vw, 24px);
    padding: 10px 4px;
    flex-wrap: wrap;
  }

  .step-column {
    min-width: 30px;
  }

  .ref {
    height: 18px;
    font-size: 13px;
  }

  .frame {
    width: 29px;
    height: 29px;
    font-size: 13px;
  }

  .status {
    font-size: 12px;
    margin-top: 3px;
  }

  #explanation {
    font-size: 15px;
    min-height: 24px;
    padding-top: 4px;
  }

  .summary {
    display: block !important;
    margin: 8px 10px;
    padding: 10px 14px;
    font-size: 15px;
    line-height: 1.45;
  }

  .footer {
    background: white !important;
    color: #6296aa !important;
    border-top: 1px solid #ddd;
    font-size: 15px;
    padding: 7px 5px 3px;
    margin-top: 4px;
    text-align: center;
    font-weight: bold;
    line-height: 1.3;
  }

  .algorithm-name {
    font-size: 12px;
    margin-top: 2px;
  }

  .overlay {
    display: none !important;
  }

  .frame.hit-highlight {
    background: #fff500 !important;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .frame.fault-highlight {
    background: #ffb36b !important;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="bar">INSTRUCTIONS</div>

  <section class="top">
    <div class="panel">
      <div class="panel-title">INPUT FIELDS</div>

      <div class="fields" id="inputPanel">
        <div class="field">
          <label for="frames">No. of Frames:</label>
          <input id="frames" type="number" min="3" max="7"
                 placeholder="(3 - 7)" value="3">
        </div>

        <div class="field">
          <label for="reference">Reference String:</label>
          <input id="reference" type="text"
                 placeholder="e.g. 5, 9, 18, 2, 15">
        </div>
      </div>

      <div class="fields" id="countPanel" style="display:none">
        <div class="field">
          <label for="faultInput">Total no. of Page Fault:</label>
          <input id="faultInput" type="number" min="0"
                 placeholder="Count faults">
        </div>

        <div class="field">
          <label for="hitInput">Total no. of Page Hit:</label>
          <input id="hitInput" type="number" min="0"
                 placeholder="Count hits">
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:120px 1fr;gap:0 12px;align-items:start">
      <div class="controls">
        <button id="submitBtn">SUBMIT</button>
        <button id="nextBtn" disabled>NEXT</button>
        <button id="resetBtn">RESET</button>
        <button id="printBtn" disabled>PRINT</button>
      </div>

      <div class="details" id="details" style="display:none">
        No. of Frames: <span id="frameText"></span><br>
        Reference String: <span id="refText"></span>
      </div>
    </div>
  </section>

  <section class="panel memory">
    <div class="panel-title">MAIN MEMORY</div>

    <div class="memory-body">
      <div id="visual"></div>
      <div id="explanation"></div>
    </div>
  </section>

  <div class="summary" id="summary"></div>

  <div class="footer">
   
    <div class="algorithm-name">FIFO Page Replacement Algorithm</div>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <button class="close" id="closeModal" aria-label="Close">×</button>
    <div class="symbol" id="modalSymbol">✓</div>
    <h2 id="modalTitle">Success</h2>
    <p id="modalMessage"></p>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  let refs = [];
  let frameCount = 3;
  let steps = [];
  let index = -1;
  let faultCount = 0;
  let hitCount = 0;
  let phase = "input";

  function showModal(title, message, type = "success") {
    $("modalTitle").textContent = title;
    $("modalMessage").textContent = message;

    const symbol = $("modalSymbol");
    symbol.className = "symbol " +
      (type === "error" ? "error" :
       type === "info" ? "info" : "");

    symbol.textContent =
      type === "error" ? "!" :
      type === "info" ? "i" : "✓";

    $("overlay").style.display = "flex";
  }

  function closeModal() {
    $("overlay").style.display = "none";
  }

  $("closeModal").addEventListener("click", closeModal);

  $("overlay").addEventListener("click", event => {
    if (event.target === $("overlay")) {
      closeModal();
    }
  });

  function validate() {
    const rawFrames = $("frames").value.trim();

    if (!rawFrames) {
      showModal(
        "Missing Frame Count",
        "Please enter the number of frames (3–7).",
        "error"
      );
      return false;
    }

    if (!/^\d+$/.test(rawFrames) ||
        Number(rawFrames) < 3 ||
        Number(rawFrames) > 7) {
      showModal(
        "Frame Value Out of Range",
        "The number of frames must be an integer between 3 and 7.",
        "error"
      );
      return false;
    }

    const raw = $("reference").value.trim();

    if (!raw) {
      showModal(
        "Reference String Required",
        "Please enter a reference string containing 1–20 page numbers.",
        "error"
      );
      return false;
    }

    const tokens = raw.split(",");

    if (tokens.length > 20 || tokens.length < 1) {
      showModal(
        "Reference String Out of Range",
        "The number of integers must be between 1 and 20.",
        "error"
      );
      return false;
    }

    if (tokens.some(token => token.trim() === "")) {
      showModal(
        "Invalid Reference String",
        "Enter a number between each comma. Example: 5, 9, 18, 2, 15.",
        "error"
      );
      return false;
    }

    if (tokens.some(token => !/^\d+$/.test(token.trim()))) {
      showModal(
        "Invalid Integer",
        "Each reference value must be a non-negative whole number. Letters, decimals and negative numbers are not allowed.",
        "error"
      );
      return false;
    }

    refs = tokens.map(token => Number(token.trim()));

    if (refs.some(number => !Number.isSafeInteger(number))) {
      showModal(
        "Integer Value Too Large",
        "Please use page numbers within the safe integer range.",
        "error"
      );
      return false;
    }

    frameCount = Number(rawFrames);
    return true;
  }

  function buildSteps() {
    // FIFO uses fixed frame slots and replaces the oldest loaded page.
    const frames = Array(frameCount).fill(null);

    let nextReplace = 0;
    let faults = 0;
    let hits = 0;

    steps = refs.map((page, position) => {
      const hit = frames.includes(page);

      let changedSlot = -1;
      let replacedPage = null;
      let loadedEmpty = false;

      if (hit) {
        hits++;
      } else {
        faults++;

        const emptySlot = frames.indexOf(null);

        if (emptySlot !== -1) {
          changedSlot = emptySlot;
          frames[emptySlot] = page;

          // Next replacement points to the next FIFO slot.
          nextReplace = (emptySlot + 1) % frameCount;
          loadedEmpty = true;
        } else {
          changedSlot = nextReplace;
          replacedPage = frames[nextReplace];

          frames[nextReplace] = page;
          nextReplace = (nextReplace + 1) % frameCount;
        }
      }

      return {
        page,
        frames: [...frames],
        hit,
        faults,
        hits,
        position,
        changedSlot,
        replacedPage,
        loadedEmpty
      };
    });

    faultCount = faults;
    hitCount = hits;
    index = -1;
  }

  function renderStep() {
    const visual = $("visual");
    visual.innerHTML = "";

    if (index < 0) {
      $("explanation").textContent = "";
      return;
    }

    const step = steps[index];

    // Display all steps processed so far.
    steps.forEach((currentStep, i) => {
      if (i > index) return;

      const column = document.createElement("div");
      column.className = "step-column";

      const reference = document.createElement("div");
      reference.className = "ref";
      reference.textContent = currentStep.page;
      column.appendChild(reference);

      currentStep.frames.forEach((value, slot) => {
        const cell = document.createElement("div");
        cell.className = "frame";

        if (currentStep.hit && value === currentStep.page) {
          cell.classList.add("hit-highlight");
        } else if (
          !currentStep.hit &&
          slot === currentStep.changedSlot
        ) {
          cell.classList.add("fault-highlight");
        }

        cell.textContent = value === null ? "" : value;
        column.appendChild(cell);
      });

      const status = document.createElement("div");
      status.className = "status " +
        (currentStep.hit ? "hit-status" : "fault-status");

      status.textContent = currentStep.hit ? "Hit" : "Fault";
      column.appendChild(status);
      visual.appendChild(column);
    });

    // Correct explanation for hit, empty frame and replacement.
    if (step.hit) {
      $("explanation").textContent =
        `Page ${step.page} is already in memory: Page Hit. ` +
        `Total hits: ${step.hits}, page faults: ${step.faults}.`;
    } else if (step.loadedEmpty) {
      $("explanation").textContent =
        `Page ${step.page} is loaded into an empty frame. Page Fault.`;
    } else {
      $("explanation").textContent =
        `Page ${step.page} replaces page ${step.replacedPage}, ` +
        `the oldest page, using FIFO (First In, First Out). Page Fault.`;
    }

    if (index === steps.length - 1) {
      $("nextBtn").disabled = true;
      phase = "count";

      $("submitBtn").disabled = false;
      $("countPanel").style.display = "block";
      $("inputPanel").style.display = "none";

      showModal(
        "Count Page Faults and Page Hits",
        "Enter the number of page faults and page hits, then click SUBMIT.",
        "info"
      );
    }
  }

  $("submitBtn").addEventListener("click", () => {
    if (phase === "input") {
      if (!validate()) return;

      buildSteps();

      $("details").style.display = "block";
      $("frameText").textContent = frameCount;
      $("refText").textContent = refs.join(", ");

      $("inputPanel").style.display = "none";
      $("countPanel").style.display = "none";

      $("submitBtn").disabled = true;
      $("nextBtn").disabled = false;
      $("printBtn").disabled = true;

      $("summary").style.display = "none";
      $("visual").innerHTML = "";

      $("explanation").textContent =
        "Input accepted. Click NEXT to access the first page from the reference string.";

      phase = "simulation";

      showModal(
        "Success",
        "Now click NEXT to access the first page from the reference string."
      );

    } else if (phase === "count") {
      const faults = $("faultInput").value.trim();
      const hits = $("hitInput").value.trim();

      if (faults === "" || hits === "") {
        showModal(
          "Counts Required",
          "Enter both the total number of page faults and page hits.",
          "error"
        );
        return;
      }

      if (!/^\d+$/.test(faults) || !/^\d+$/.test(hits)) {
        showModal(
          "Invalid Count",
          "Page faults and page hits must be non-negative integers.",
          "error"
        );
        return;
      }

      if (
        Number(faults) !== faultCount ||
        Number(hits) !== hitCount
      ) {
        showModal(
          "Incorrect Count",
          `Check your answer and try again. Correct totals: ` +
          `${faultCount} page faults and ${hitCount} page hits.`,
          "error"
        );
        return;
      }

      phase = "done";

      $("printBtn").disabled = false;
      $("submitBtn").disabled = true;

      $("summary").style.display = "block";
      $("summary").innerHTML =
        `<strong>Simulation Result</strong><br>` +
        `Total Page Faults: ${faultCount}<br>` +
        `Total Page Hits: ${hitCount}<br>` +
        `Reference Count: ${refs.length}<br>` +
        `Frames: ${frameCount}<br>` +
        `Reference String: ${refs.join(", ")}<br>` +
        `Algorithm: FIFO (First In, First Out)`;

      showModal(
        "Success",
        "Your page-fault and page-hit counts are correct. Now click PRINT."
      );
    }
  });

  $("nextBtn").addEventListener("click", () => {
    if (phase !== "simulation" || index >= steps.length - 1) {
      return;
    }

    index++;
    renderStep();
  });

  $("resetBtn").addEventListener("click", () => {
    refs = [];
    steps = [];
    index = -1;
    faultCount = 0;
    hitCount = 0;
    phase = "input";

    $("frames").value = "3";
    $("reference").value = "";
    $("faultInput").value = "";
    $("hitInput").value = "";

    $("inputPanel").style.display = "block";
    $("countPanel").style.display = "none";
    $("details").style.display = "none";

    $("visual").innerHTML = "";
    $("explanation").textContent = "";
    $("summary").style.display = "none";

    $("submitBtn").disabled = false;
    $("nextBtn").disabled = true;
    $("printBtn").disabled = true;

    closeModal();
  });

  $("printBtn").addEventListener("click", () => {
    if (phase === "done") {
      window.print();
    }
  });
})();
</script>
</body>
</html>
